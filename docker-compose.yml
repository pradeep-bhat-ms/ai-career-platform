services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicareerplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicareerplatform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      # Host port matches application.yaml's datasource url (localhost:5433)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicareerplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: