spring:
  application:
    name: aicareerplatform

  datasource:
    url: jdbc:postgresql://localhost:5432/aicareerplatform
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-3.6-flash

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: text-embedding-004

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000